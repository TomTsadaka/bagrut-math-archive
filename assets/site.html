<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מאגר שאלות הבגרות במתמטיקה</title>
<style>
:root{
  --paper:#f6f8fa; --card:#ffffff; --ink:#14202c; --muted:#5d6e80;
  --line:#d9e1e9; --line2:#eaeff4; --accent:#1a5f8a; --accent-soft:#e7f0f7;
  --seal:#8c3a24; --ok:#2c6b52; --ok-soft:#e6f1ec;
  --shadow:0 1px 2px rgba(20,32,44,.06), 0 8px 24px rgba(20,32,44,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0f1720; --card:#16202b; --ink:#e4ecf3; --muted:#94a6b8;
    --line:#25333f; --line2:#1d2833; --accent:#6ea9cf; --accent-soft:#16303f;
    --seal:#cd7f66; --ok:#5aa384; --ok-soft:#142b23;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#0f1720; --card:#16202b; --ink:#e4ecf3; --muted:#94a6b8;
  --line:#25333f; --line2:#1d2833; --accent:#6ea9cf; --accent-soft:#16303f;
  --seal:#cd7f66; --ok:#5aa384; --ok-soft:#142b23;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Assistant","Heebo","Rubik","Noto Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.6; direction:rtl;
}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ---------- כותרת ---------- */
header{border-bottom:1px solid var(--line);background:var(--card)}
.head{padding:38px 0 26px;display:flex;flex-wrap:wrap;gap:26px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
  font-weight:700;margin:0 0 8px}
h1{margin:0;font-size:clamp(28px,4.4vw,42px);font-weight:800;letter-spacing:-.02em;
  text-wrap:balance;line-height:1.15}
.sub{margin:10px 0 0;color:var(--muted);max-width:56ch}
.figures-note{margin-top:6px;font-size:14px;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:280px}
.stat{background:var(--card);padding:12px 14px}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.04em}

/* ---------- מסננים ---------- */
.filters{position:sticky;top:0;z-index:20;background:var(--card);
  border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--card);color:var(--muted);
  padding:7px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
select,input[type=search]{font:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);color:var(--ink)}
input[type=search]{min-width:190px}
.count{margin-inline-start:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- תקופות ---------- */
.era{margin:34px 0 0}
.era-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;
  padding-bottom:8px;border-bottom:2px solid var(--seal)}
.era-head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.era-years{font-size:13px;color:var(--seal);font-weight:700}
.era-note{font-size:13px;color:var(--muted);margin-inline-start:auto}

/* ---------- שנים ושורות ---------- */
.year{margin-top:18px}
.year-label{font-size:13px;font-weight:700;color:var(--muted);padding:4px 0;
  border-bottom:1px solid var(--line2);margin-bottom:8px;letter-spacing:.02em}
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 13px}
.code{font-size:14px;font-weight:700;color:var(--accent)}
.badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:5px;
  background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.badge.u5{background:var(--seal);color:#fff}
.meta{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.links{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lnk{font-size:12px;font-weight:700;text-decoration:none;padding:4px 9px;border-radius:6px;
  border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.lnk:hover{border-color:var(--accent);color:var(--accent)}
.lnk.sol{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.missing{font-size:12px;color:var(--muted);opacity:.7}

/* ---------- הדגמה ---------- */
.demo{margin:46px 0 0;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:22px 24px;box-shadow:var(--shadow)}
.demo h2{margin:0 0 4px;font-size:19px;font-weight:800}
.demo .sub{margin-bottom:18px;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--accent-soft);
  color:var(--accent);font-weight:700}
.tag.d{background:var(--seal);color:#fff}
.tag.n{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:600}
.qbody{margin:0 0 14px;white-space:pre-wrap}
.part{border-inline-start:3px solid var(--line);padding-inline-start:14px;margin:14px 0}
.part-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.part-h b{color:var(--seal);font-size:15px}
.fig{margin:12px 0;padding:12px;border:1px solid var(--line2);border-radius:9px;
  background:var(--paper);text-align:center}
.fig img{max-width:min(300px,100%);height:auto;display:inline-block}
.fig figcaption{font-size:12px;color:var(--muted);margin-top:8px}
.skills{font-size:13px;color:var(--muted);border-top:1px solid var(--line2);padding-top:12px;margin-top:14px}
.mth{font-family:"Cambria Math","Latin Modern Math",Georgia,serif;direction:ltr;
  display:inline-block;unicode-bidi:isolate}
.frac{display:inline-flex;flex-direction:column;vertical-align:-.5em;text-align:center;
  font-size:.9em;margin:0 .15em}
.frac .num{border-bottom:1.2px solid currentColor;padding:0 .25em}
.frac .den{padding:0 .25em}
.sqrt{border-top:1.2px solid currentColor;padding:0 .15em}

footer{margin:50px 0 0;border-top:1px solid var(--line);background:var(--card)}
.foot{padding:22px 0 34px;font-size:13px;color:var(--muted)}
.foot b{color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:46px}
@media (max-width:640px){
  .row{grid-template-columns:auto auto 1fr;row-gap:8px}
  .links{grid-column:1/-1}
  .era-note{width:100%;margin-inline-start:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><style>
.figs{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}
.figs img{max-width:260px;height:auto;border:1px solid var(--line);border-radius:8px;
  background:#fff;padding:8px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.qnum{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin-bottom:8px}
.qimg{width:100%;height:auto;display:block;border-radius:8px;background:#fff;
  border:1px solid var(--line)}
.qcard.scan{padding:14px}
.modebtn{appearance:none;border:1px solid var(--line);border-radius:8px;background:var(--card);
  color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:7px 13px;cursor:pointer}
.modebtn:hover{border-color:var(--accent);color:var(--accent)}
.tag.sol{background:var(--ok-soft);color:var(--ok);text-decoration:none;font-weight:700}
.more{text-align:center;padding:18px}
.more button{appearance:none;border:1px solid var(--line);border-radius:9px;background:var(--card);
  color:var(--accent);font:inherit;font-weight:700;padding:11px 22px;cursor:pointer}
.more button:hover{border-color:var(--accent)}
.loading{text-align:center;color:var(--muted);padding:70px}
.note{background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;
  padding:16px 18px;margin:22px 0;color:var(--ink);font-size:14px;line-height:1.7}
.note b{color:var(--accent)}
.note code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--card);
  padding:2px 6px;border-radius:4px;border:1px solid var(--line);direction:ltr;display:inline-block}
</style>
</head>
<body>
<header>
  <div class="wrap head">
    <div>
      <p class="eyebrow">2001–2026 · מתוך שאלוני משרד החינוך</p>
      <h1>מאגר שאלות הבגרות במתמטיקה</h1>
      <p class="sub">שאלות שחולצו משאלוני הבגרות, עם השרטוטים המקוריים,
        מסווגות לפי נושא, רמה ודרגת קושי.</p>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<div class="filters">
  <div class="wrap frow">
    <div class="seg" role="group" aria-label="רמת לימוד">
      <button data-u="" aria-pressed="true">הכל</button>
      <button data-u="3" aria-pressed="false">3 יח״ל</button>
      <button data-u="4" aria-pressed="false">4 יח״ל</button>
      <button data-u="5" aria-pressed="false">5 יח״ל</button>
    </div>
    <select id="topic"><option value="">כל הנושאים</option></select>
    <select id="diff"><option value="">כל רמות הקושי</option>
      <option value="1">קושי 1</option><option value="2">קושי 2</option>
      <option value="3">קושי 3</option><option value="4">קושי 4</option>
      <option value="5">קושי 5</option></select>
    <select id="year"><option value="">כל השנים</option></select>
    <button class="seg" id="figonly" data-on="0" aria-pressed="false"
      style="padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);background:var(--card)">רק עם שרטוט</button>
    <input type="search" id="q" placeholder="חיפוש בנוסח, נושא או מיומנות…" aria-label="חיפוש">
    <button id="mode" class="modebtn">מסווגות בלבד</button>
    <span class="count" id="count"></span>
  </div>
</div>

<main class="wrap">
  <div id="qlist"><div class="loading">טוען…</div></div>
</main>

<footer><div class="wrap foot" id="foot"></div></footer>
<script>
let QUESTIONS = [], SCANS = [], STATS = {};
const el = i => document.getElementById(i);
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };

const B = String.fromCharCode(92);
const SYM = {'cdot':'·','times':'×','div':'÷','leq':'≤','le':'≤','geq':'≥','ge':'≥',
 'neq':'≠','ne':'≠','pm':'±','infty':'∞','alpha':'α','beta':'β','gamma':'γ','theta':'θ',
 'pi':'π','lambda':'λ','mu':'μ','Delta':'Δ','angle':'∠','perp':'⊥','parallel':'∥',
 'in':'∈','to':'→','Rightarrow':'⇒','approx':'≈','sin':'sin','cos':'cos','tan':'tan',
 'log':'log','ln':'ln','left':'','right':''};
function tex(t){
  let x = esc(t);
  x = x.replace(new RegExp(B+B+'frac\\s*\\{([^{}]*)\\}\\s*\\{([^{}]*)\\}','g'),
    (m,a,b)=>'<span class="frac"><span class="num">'+a+'</span><span class="den">'+b+'</span></span>');
  x = x.replace(new RegExp(B+B+'sqrt\\s*\\{([^{}]*)\\}','g'),
    (m,a)=>'√<span class="sqrt">'+a+'</span>');
  Object.keys(SYM).sort((a,b)=>b.length-a.length).forEach(k=>{ x = x.split(B+k).join(SYM[k]); });
  x = x.replace(/\^\{([^{}]*)\}/g,'<sup>$1</sup>').replace(/\^(\w)/g,'<sup>$1</sup>');
  x = x.replace(/_\{([^{}]*)\}/g,'<sub>$1</sub>').replace(/_(\w)/g,'<sub>$1</sub>');
  return '<span class="mth">'+x.split('{').join('').split('}').join('')+'</span>';
}
function md(s){
  if(!s) return '';
  return String(s).split(/(\$[^$]*\$)/g).map(p =>
    (p.startsWith('$') && p.endsWith('$') && p.length>2) ? tex(p.slice(1,-1))
      : esc(p).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
  ).join('');
}

let F = { units:'', topic:'', diff:'', year:'', fig:false, q:'' };
let MODE = 'scan';      // scan = שאלות כתמונה, data = שאלות מסווגות
let SHOWN = 30;

function card(x){
  const figs = (x.figures||[]).length
    ? '<div class="figs">'+x.figures.map(f=>'<img src="'+esc(f)+'" alt="שרטוט מתוך השאלה" loading="lazy">').join('')+'</div>'
    : '';
  const parts = (x.parts||[]).map(p =>
    '<div class="part"><div class="part-h"><b>סעיף '+esc(p.letter)+'</b>'
    + (p.topic?'<span class="tag n">'+esc(p.topic)+'</span>':'')
    + (p.difficulty?'<span class="tag n">קושי '+p.difficulty+'</span>':'')
    + (p.points?'<span class="tag n">'+p.points+' נק׳</span>':'')
    + '</div><div class="qbody">'+md(p.body)+'</div></div>').join('');
  return '<article class="qcard">'
    + '<div class="qnum">שאלה '+esc(x.number||'')+(x.chapter?' · '+esc(x.chapter):'')+'</div>'
    + '<div class="tags">'
    + '<span class="tag">'+esc(x.topic||'—')+'</span>'
    + '<span class="tag d">קושי '+(x.difficulty??'—')+'</span>'
    + '<span class="tag n">'+x.year+'</span>'
    + '<span class="tag n mono">'+esc(x.code)+'</span>'
    + '<span class="tag n">'+(x.units||'?')+' יח״ל</span>'
    + (x.moed?'<span class="tag n">'+esc(x.moed)+'</span>':'')
    + (x.points?'<span class="tag n">'+x.points+' נק׳</span>':'')
    + (x.est_minutes?'<span class="tag n">~'+x.est_minutes+' דק׳</span>':'')
    + '</div>'
    + figs
    + '<div class="qbody">'+md(x.body)+'</div>'
    + parts
    + ((x.skills||[]).length?'<div class="skills"><b>מיומנויות:</b> '+esc(x.skills.join(' · '))+'</div>':'')
    + '</article>';
}

function scanCard(x){
  return '<article class="qcard scan">'
    + '<div class="tags">'
    + '<span class="tag n">שאלה '+esc(x.number)+'</span>'
    + '<span class="tag">'+x.year+'</span>'
    + '<span class="tag n mono">'+esc(x.code)+'</span>'
    + '<span class="tag n">'+(x.units||'?')+' יח״ל</span>'
    + (x.moed?'<span class="tag n">'+esc(x.moed)+'</span>':'')
    + (x.solution_url?'<a class="tag sol" target="_blank" rel="noopener" href="'
        +esc(x.solution_url)+'">פתרון רשמי ↗</a>':'')
    + '</div>'
    + '<img class="qimg" src="'+esc(x.img)+'" alt="שאלה '+esc(x.number)+'" loading="lazy">'
    + '</article>';
}

function render(){
  if (MODE === 'scan'){
    const o = SCANS.filter(x =>
      (!F.units || String(x.units)===F.units) &&
      (!F.year  || String(x.year)===F.year) &&
      (!F.q     || (x.text||'').includes(F.q) || String(x.code).includes(F.q)));
    el('count').textContent = o.length.toLocaleString('he-IL') + ' שאלות';
    const page = o.slice(0, SHOWN);
    el('qlist').innerHTML = page.length
      ? page.map(scanCard).join('')
        + (o.length > SHOWN ? '<div class="more"><button id="more">הצג עוד '
           + Math.min(60, o.length-SHOWN) + ' שאלות (מתוך '
           + (o.length-SHOWN).toLocaleString('he-IL') + ')</button></div>' : '')
      : '<div class="empty">לא נמצאו שאלות מתאימות.</div>';
    const mb = document.getElementById('more');
    if (mb) mb.addEventListener('click', ()=>{ SHOWN += 60; render(); });
    return;
  }
  const out = QUESTIONS.filter(x =>
      (!F.units || String(x.units)===F.units) &&
      (!F.topic || x.topic===F.topic) &&
      (!F.diff  || String(x.difficulty)===F.diff) &&
      (!F.year  || String(x.year)===F.year) &&
      (!F.fig   || (x.figures||[]).length) &&
      (!F.q     || (x.body||'').includes(F.q) || (x.topic||'').includes(F.q)
                || (x.skills||[]).join(' ').includes(F.q)
                || (x.parts||[]).some(p=>(p.body||'').includes(F.q))));
  el('count').textContent = out.length.toLocaleString('he-IL') + ' שאלות';
  if (out.length){ el('qlist').innerHTML = out.map(card).join(''); return; }
  el('qlist').innerHTML = QUESTIONS.length
    ? '<div class="empty">לא נמצאו שאלות מתאימות לסינון.</div>'
    : '<div class="note"><b>המאגר עדיין מתמלא.</b><br>'
      + 'השאלונים והשרטוטים כבר ירדו, אבל שלב חילוץ השאלות טרם רץ על כל המאגר. '
      + 'להרצה: <code>python3 run.py extract</code></div>';
}

async function boot(){
  const [q, sc, s] = await Promise.all([
    fetch('data/questions.json').then(r=>r.json()).catch(()=>[]),
    fetch('data/scans.json').then(r=>r.json()).catch(()=>[]),
    fetch('data/stats.json').then(r=>r.json()).catch(()=>({})),
  ]);
  QUESTIONS = q; SCANS = sc; STATS = s;

  el('stats').innerHTML = [
    ['שאלות', SCANS.length.toLocaleString('he-IL')],
    ['מסווגות', QUESTIONS.length],
    ['שאלונים', STATS.papers||0],
    ['שנים', (STATS.year_min||'')+'–'+(STATS.year_max||'')]
  ].map(([k,v]) => '<div class="stat"><b class="mono">'+v+'</b><span>'+k+'</span></div>').join('');

  const topics = [...new Set(QUESTIONS.map(x=>x.topic).filter(Boolean))].sort();
  el('topic').insertAdjacentHTML('beforeend', topics.map(t=>'<option>'+esc(t)+'</option>').join(''));
  const years = [...new Set(QUESTIONS.map(x=>x.year))].sort((a,b)=>b-a);
  el('year').insertAdjacentHTML('beforeend', years.map(y=>'<option>'+y+'</option>').join(''));

  document.querySelectorAll('.seg button[data-u]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.seg button[data-u]').forEach(x => x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true'); F.units = b.dataset.u; SHOWN = 30; render();
  }));
  el('figonly').addEventListener('click', () => {
    F.fig = !F.fig; el('figonly').setAttribute('aria-pressed', F.fig?'true':'false');
    el('figonly').style.background = F.fig ? 'var(--accent)' : 'var(--card)';
    el('figonly').style.color = F.fig ? '#fff' : 'var(--muted)';
    render();
  });
  el('topic').addEventListener('change', e => { F.topic = e.target.value; SHOWN = 30; render(); });
  el('diff').addEventListener('change',  e => { F.diff  = e.target.value; SHOWN = 30; render(); });
  el('year').addEventListener('change',  e => { F.year  = e.target.value; SHOWN = 30; render(); });
  el('q').addEventListener('input',      e => { F.q     = e.target.value.trim(); SHOWN = 30; render(); });

  el('mode').addEventListener('click', ()=>{
    MODE = (MODE === 'scan') ? 'data' : 'scan';
    el('mode').textContent = (MODE === 'scan') ? 'מסווגות בלבד' : 'כל השאלות';
    el('topic').style.display = MODE==='data' ? '' : 'none';
    el('diff').style.display  = MODE==='data' ? '' : 'none';
    el('figonly').style.display = MODE==='data' ? '' : 'none';
    SHOWN = 30; render();
  });
  el('topic').style.display='none'; el('diff').style.display='none';
  el('figonly').style.display='none';
  el('foot').innerHTML = '<b>מקור:</b> שאלוני הבגרות של משרד החינוך. '
    + 'הנוסח, השרטוטים והסיווג חולצו אוטומטית מקובצי ה-PDF המקוריים.';
  render();
}
boot();
</script>
</body>
</html>
